server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка файлов и импорт таблиц не должны упираться в лимит прокси.
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Сайт сейчас по HTTP: HSTS и принудительный https здесь сломали бы вход.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'" always;

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Ассеты собираются с хешем в имени, поэтому кэшируются навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'" always;
        try_files $uri =404;
    }

    # Имя api резолвится через DNS Docker при каждом запросе.
    # Иначе nginx запоминает адрес контейнера, в том числе нерабочий IPv6,
    # и вместо JSON отдаёт свою HTML-страницу 502.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # Маршрутизация на стороне клиента: любой неизвестный путь отдаёт приложение.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
