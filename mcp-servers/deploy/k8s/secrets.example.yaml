# Скопируйте и подставьте боевые значения. В kustomization этот файл не входит.
# kubectl apply -f secrets.example.yaml
apiVersion: v1
kind: Secret
metadata:
  name: mcp-ad-credentials
  namespace: mcp-systems
type: Opaque
stringData:
  AD_BIND_USER: "EXAMPLE\\svc-mcp"
  AD_BIND_PASSWORD: "replace-me"
  MCP_AUTH_TOKEN: "replace-with-the-same-token-the-gateway-sends"
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-exchange-credentials
  namespace: mcp-systems
type: Opaque
stringData:
  EXCHANGE_TENANT_ID: "00000000-0000-0000-0000-000000000000"
  EXCHANGE_CLIENT_ID: "replace-me"
  EXCHANGE_CLIENT_SECRET: "replace-me"
  EXCHANGE_EWS_URL: "https://mail.example.local/EWS/Exchange.asmx"
  EXCHANGE_USERNAME: "EXAMPLE\\svc-mcp"
  EXCHANGE_PASSWORD: "replace-me"
  MCP_AUTH_TOKEN: "replace-with-the-same-token-the-gateway-sends"
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-onec-credentials
  namespace: mcp-systems
type: Opaque
stringData:
  ONEC_USERNAME: "mcp"
  ONEC_PASSWORD: "replace-me"
  MCP_AUTH_TOKEN: "replace-with-the-same-token-the-gateway-sends"
