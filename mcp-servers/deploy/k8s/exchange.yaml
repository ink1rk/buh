apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-exchange-config
  namespace: mcp-systems
data:
  EXCHANGE_MODE: "graph"
  EXCHANGE_GRAPH_SCOPE: "https://graph.microsoft.com/.default"
  EXCHANGE_AUTH: "ntlm"
  EXCHANGE_IMPERSONATE: "false"
  EXCHANGE_VERIFY_TLS: "true"
  EXCHANGE_VERSION: "Exchange2013"
  EXCHANGE_TIMEOUT: "30"
  MCP_STATELESS: "true"
  MCP_JSON_RESPONSE: "true"
  MCP_RESOURCE_URL: "http://mcp-exchange.mcp-systems.svc.cluster.local:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-exchange
  namespace: mcp-systems
  labels:
    app.kubernetes.io/name: mcp-exchange
    app.kubernetes.io/part-of: mcp-enterprise
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-exchange
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-exchange
        app.kubernetes.io/part-of: mcp-enterprise
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-exchange
          image: mcp-exchange:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mcp-exchange-config
            - secretRef:
                name: mcp-exchange-credentials
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-exchange
  namespace: mcp-systems
  labels:
    app.kubernetes.io/name: mcp-exchange
spec:
  selector:
    app.kubernetes.io/name: mcp-exchange
  ports:
    - name: http
      port: 8080
      targetPort: http
