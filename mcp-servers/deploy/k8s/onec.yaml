apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-onec-config
  namespace: mcp-systems
data:
  ONEC_BASE_URL: "http://onec.example.local/acc/odata/standard.odata"
  ONEC_HTTP_SERVICE_URL: ""
  ONEC_VERIFY_TLS: "true"
  ONEC_TIMEOUT: "30"
  MCP_STATELESS: "true"
  MCP_JSON_RESPONSE: "true"
  MCP_RESOURCE_URL: "http://mcp-onec.mcp-systems.svc.cluster.local:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-onec
  namespace: mcp-systems
  labels:
    app.kubernetes.io/name: mcp-onec
    app.kubernetes.io/part-of: mcp-enterprise
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-onec
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-onec
        app.kubernetes.io/part-of: mcp-enterprise
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-onec
          image: mcp-onec:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mcp-onec-config
            - secretRef:
                name: mcp-onec-credentials
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-onec
  namespace: mcp-systems
  labels:
    app.kubernetes.io/name: mcp-onec
spec:
  selector:
    app.kubernetes.io/name: mcp-onec
  ports:
    - name: http
      port: 8080
      targetPort: http
