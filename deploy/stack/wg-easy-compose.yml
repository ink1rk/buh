volumes:
  etc_wireguard:

services:
  wg-easy:
    environment:
      - LANG=ru
      - INSECURE=true
      - PORT=51821
      - HOST=0.0.0.0
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    network_mode: host
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun
