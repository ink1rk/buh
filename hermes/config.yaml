# Профиль Hermes. Секреты — в env, не здесь.
# Скопировать в $HERMES_HOME/config.yaml, если своего ещё нет.

model:
  # Локальный шлюз Cursor. Ключ шлюза — OPENAI_API_KEY в .env.
  default: cursor-grok-4.6-high-fast
  provider: custom
  base_url: http://127.0.0.1:8791/v1

toolsets:
  - hermes-cli
  - skills
  - terminal
  - file
  - browser
  - memory

tts:
  provider: elevenlabs
  elevenlabs:
    model_id: eleven_multilingual_v2

skills:
  external_dirs:
    - /opt/assistant/hermes/skills
