# Профиль Hermes. Секреты — в env, не здесь.
# Скопировать в $HERMES_HOME/config.yaml, если своего ещё нет.

model:
  # Локальный шлюз Cursor. Без key_env Hermes шлёт заглушку no-key-required,
  # и шлюз отвечает 401.
  default: cursor-grok-4.6-high-fast
  provider: custom
  base_url: http://127.0.0.1:8791/v1
  key_env: OPENAI_API_KEY

# Меню команд Telegram и служебные фразы Hermes.
display:
  language: ru

toolsets:
  - hermes-cli
  - skills
  - terminal
  - file
  - browser
  - memory

tts:
  provider: edge
  edge:
    voice: ru-RU-DmitryNeural

skills:
  external_dirs:
    - /opt/assistant/hermes/skills

# С этой сети api.telegram.org напрямую не открывается.
telegram:
  proxy_url: http://172.20.20.231:8080
