# Профиль Hermes. Секреты — в env, не здесь.
# Скопировать в $HERMES_HOME/config.yaml, если своего ещё нет.

toolsets:
  - hermes-cli
  - skills
  - terminal
  - file
  - browser
  - mcp
  - memory

tts:
  provider: elevenlabs
  elevenlabs:
    model_id: eleven_multilingual_v2

# Финансы по HTTP MCP. Токен подставляет install.sh из окружения MCP_TOKEN.
mcp_servers:
  finance:
    url: http://127.0.0.1/api/v1/mcp
    headers:
      Authorization: "Bearer ${MCP_TOKEN}"

skills:
  external_dirs:
    - /opt/assistant/hermes/skills
