# Local dry-run only. No host ports for Postgres or Redis.
# The admin API is published on the host loopback, not on a public interface.
name: tmn-dev
services:
  db:
    image: postgres:16.6
    environment:
      POSTGRES_USER: tmn_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tmn
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmn_app -d tmn"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: "no"
  redis:
    image: redis:7.4
    user: "999:999"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--bind", "0.0.0.0", "--protected-mode", "yes"]
    networks: [data]
    restart: "no"
  api:
    build: .
    user: "1000:1000"
    environment:
      ENVIRONMENT: development
      DRY_RUN: "true"
      PUBLISH_ENABLED: "false"
      GLOBAL_KILL_SWITCH: "true"
      SPONSORED_ENABLED: "false"
      LLM_MODE: mock
      SOURCE_MODE: offline
      DATABASE_URL: postgresql+psycopg://tmn_app:${POSTGRES_PASSWORD}@db:5432/tmn
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      APP_BIND_HOST: 0.0.0.0
      APP_BIND_PORT: 8787
      TMN_SCHEMA: migrate
    ports:
      - "127.0.0.1:8787:8787"
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    read_only: true
    tmpfs: [/tmp, /app/var]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
  scheduler:
    build: .
    user: "1000:1000"
    environment:
      ENVIRONMENT: development
      DRY_RUN: "true"
      PUBLISH_ENABLED: "false"
      GLOBAL_KILL_SWITCH: "true"
      SPONSORED_ENABLED: "false"
      LLM_MODE: mock
      SOURCE_MODE: offline
      DATABASE_URL: postgresql+psycopg://tmn_app:${POSTGRES_PASSWORD}@db:5432/tmn
      SESSION_SECRET: ${SESSION_SECRET}
      TMN_ROLE: scheduler
      TMN_SCHEMA: migrate
    command: ["python", "-m", "app.workers.run"]
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp, /app/var]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
  collector:
    build: .
    user: "1000:1000"
    environment:
      ENVIRONMENT: development
      DRY_RUN: "true"
      PUBLISH_ENABLED: "false"
      GLOBAL_KILL_SWITCH: "true"
      SOURCE_MODE: offline
      DATABASE_URL: postgresql+psycopg://tmn_app:${POSTGRES_PASSWORD}@db:5432/tmn
      SESSION_SECRET: ${SESSION_SECRET}
      TMN_ROLE: collector
      TMN_SCHEMA: migrate
    command: ["python", "-m", "app.workers.run"]
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
networks:
  data:
    internal: false
volumes:
  pgdata:
