# Staging shape. Do not start it against a live VM or a real bot token.
# Same safety defaults as dev: dry-run, publish off, kill switch on, loopback UI.
name: tmn-staging
services:
  db:
    image: postgres:16.6
    environment:
      POSTGRES_USER: tmn_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tmn
    networks: [data]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7.4
    user: "999:999"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--bind", "0.0.0.0", "--protected-mode", "yes"]
    networks: [data]
  api:
    image: tmn:staging
    user: "1000:1000"
    environment:
      ENVIRONMENT: development
      DRY_RUN: "true"
      PUBLISH_ENABLED: "false"
      GLOBAL_KILL_SWITCH: "true"
      SPONSORED_ENABLED: "false"
      LLM_MODE: mock
      SOURCE_MODE: offline
      PILOT_MODE: offline_replay
      DATABASE_URL: postgresql+psycopg://tmn_app:${POSTGRES_PASSWORD}@db:5432/tmn
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "127.0.0.1:8787:8787"
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
networks:
  data:
volumes:
  pgdata:
