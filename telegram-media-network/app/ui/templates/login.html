<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — TMN</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="wrap">
    <section class="panel" style="max-width: 460px">
      <h1>Редакция TMN</h1>
      <p class="muted">Локальная очередь. Публикация в Telegram из этого режима не уходит, пока включён DRY RUN.</p>
      {% if error %}<p class="warn">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <label>Имя <input name="username" autocomplete="username" required></label>
        <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Войти</button>
      </form>
    </section>
  </main>
</body>
</html>
