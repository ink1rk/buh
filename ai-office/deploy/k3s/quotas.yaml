apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-jobs
  namespace: ai-jobs
spec:
  hard:
    pods: "4"
    count/jobs.batch: "2"
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-core
  namespace: ai-core
spec:
  hard:
    pods: "12"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
