[project]
name = "ai-office"
version = "0.1.0"
description = "Personal AI Office: gateway, orchestrator, workers, and tool broker."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.10",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = [
  "packages/contracts",
  "packages/security",
  "apps/gateway",
  "apps/orchestrator",
  "apps/agent-worker",
  "apps/job-launcher",
  "apps/tool-broker",
]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
