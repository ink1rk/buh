server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Имя файла сборки содержит её хеш, поэтому ответ можно хранить сколько
    # угодно: новая сборка придёт под новым именем.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # А вот index.html — единственное место, где эти имена записаны. Без
    # запрета браузер берёт его из кеша по своему усмотрению и грузит старую
    # сборку: после обновления на странице оставались вчерашние подписи, хотя
    # в контейнере уже лежали новые.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location /docs {
        proxy_pass http://backend:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
