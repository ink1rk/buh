services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      MCP_TOKEN: ${MCP_TOKEN:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      VISION_MODEL: ${VISION_MODEL:-gpt-4o-mini}
      DEFAULT_USER_NAME: ${DEFAULT_USER_NAME:-Кирилл}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      DATA_DIR: /app/database
      DATABASE_URL: sqlite+aiosqlite:////app/database/finance.db
    volumes:
      - finance_data:/app/database
    networks:
      - pfa
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pfa

volumes:
  finance_data:

networks:
  pfa:
    driver: bridge
